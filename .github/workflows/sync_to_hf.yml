name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true
      - name: Install Git LFS
        run: git lfs install
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "incheif"
          git config user.email "incheif@users.noreply.github.com"
          git checkout --orphan hf-sync
          git add -A
          git commit -m "Deploy to Hugging Face"
          git push --force https://incheif:$HF_TOKEN@huggingface.co/spaces/incheif/aera-studio hf-sync:main
